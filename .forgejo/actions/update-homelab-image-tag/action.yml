name: Update Homelab Image Tag
description: Opens a pull request in a homelab repo updating a container image tag in a given file

inputs:
  token:
    description: API token for the bot user (must have write access to homelab-repo)
    required: true
  homelab-repo:
    description: "owner/repo of the homelab repository (e.g. adrian/homelab)"
    required: true
  file-path:
    description: Path to the file containing the image tag, relative to repo root
    required: true
  image-name:
    description: Full image name without tag (e.g. forgejo.salamon.xyz/adrian/website)
    required: true
  new-tag:
    description: New image tag to set
    required: true

runs:
  using: composite
  steps:
    - name: Open PR with updated tag
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        HOMELAB_REPO: ${{ inputs.homelab-repo }}
        FILE_PATH: ${{ inputs.file-path }}
        IMAGE_NAME: ${{ inputs.image-name }}
        NEW_TAG: ${{ inputs.new-tag }}
      run: |
        set -euo pipefail

        BRANCH="chore/${FORGEJO_REPOSITORY}/update-${NEW_TAG}"

        # Escape dots in image name for use in sed ERE
        ESCAPED_IMAGE=$(printf '%s' "$IMAGE_NAME" | sed 's/\./\\./g')

        # --- Fetch current file ---
        FILE_RESPONSE=$(curl -sf \
          -H "Authorization: token ${TOKEN}" \
          "${FORGEJO_API_URL}/repos/${HOMELAB_REPO}/contents/${FILE_PATH}")

        FILE_SHA=$(echo "$FILE_RESPONSE" | jq -r '.sha')

        ORIG=$(mktemp)
        UPDATED=$(mktemp)
        trap 'rm -f "$ORIG" "$UPDATED"' EXIT

        echo "$FILE_RESPONSE" | jq -r '.content' | base64 -d > "$ORIG"

        # --- Replace tag ---
        sed -E "s|(${ESCAPED_IMAGE}:)[^\"\`' ]+|\1${NEW_TAG}|g" "$ORIG" > "$UPDATED"

        if cmp -s "$ORIG" "$UPDATED"; then
          echo "Tag already set to ${NEW_TAG} — nothing to do."
          exit 0
        fi

        NEW_CONTENT_B64=$(base64 -w0 < "$UPDATED")

        # --- Create branch ---
        curl -sf -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Content-Type: application/json" \
          "${FORGEJO_API_URL}/repos/${HOMELAB_REPO}/branches" \
          -d "{\"new_branch_name\": \"${BRANCH}\", \"old_branch_name\": \"main\"}"

        # --- Commit updated file ---
        curl -sf -X PUT \
          -H "Authorization: token ${TOKEN}" \
          -H "Content-Type: application/json" \
          "${FORGEJO_API_URL}/repos/${HOMELAB_REPO}/contents/${FILE_PATH}" \
          -d "$(jq -n \
            --arg msg "chore: update ${IMAGE_NAME##*/} image to ${NEW_TAG}" \
            --arg content "$NEW_CONTENT_B64" \
            --arg sha "$FILE_SHA" \
            --arg branch "$BRANCH" \
            '{message: $msg, content: $content, sha: $sha, branch: $branch}')"

        # --- Open PR ---
        PR_URL=$(curl -sf -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Content-Type: application/json" \
          "${FORGEJO_API_URL}/repos/${HOMELAB_REPO}/pulls" \
          -d "$(jq -n \
            --arg title "chore: update ${IMAGE_NAME##*/} image to ${NEW_TAG}" \
            --arg body "Automated image tag update from [\`${FORGEJO_REPOSITORY}\`](${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}/commit/${GITHUB_SHA})." \
            --arg head "$BRANCH" \
            '{title: $title, body: $body, head: $head, base: "main"}' \
          )" | jq -r '.html_url')

        echo "PR opened: ${PR_URL}"
